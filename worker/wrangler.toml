# Portfolio Concierge — grounded RAG API + MCP server on Cloudflare Workers.
# Deployed by .github/workflows/worker.yml on push to main (worker/** paths).
name = "yaseen-concierge"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "portfolio-corpus"

# Lead pipeline storage (created + schema applied 2026-07-30). The binding
# name must stay "DB" — that is what env.DB in src/index.ts reads.
[[d1_databases]]
binding = "DB"
database_name = "yaseen-leads"
database_id = "22fc602e-3dd0-4974-8a1f-835185633208"

# Signed agreement PDFs live in the D1 database above, in agreement_pdfs.
# R2 would be the natural home for files, but enabling it requires a payment
# method on the account even for the free tier, and these documents are a few
# KB each. If volume ever justifies R2, the URL shape (/agreements/<uuid>.pdf)
# is already what R2 would have served, so only the worker changes.

[observability]
enabled = true
