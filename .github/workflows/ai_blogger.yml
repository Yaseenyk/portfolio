name: AI Blogger

# Autonomous blog pipeline: ChatGPT writes a post from scripts/topics.txt and
# commits the resulting .mdx back to main. Mondays at 10:00 UTC.
#
# SCHEDULE DISABLED 2026-08-08 — do not re-enable.
#
# Throttling this from 3×/week to weekly was the right instinct but far too
# small a correction. The sitewide-signal reasoning below turned out to be
# exactly what happened, and it has already cost the site its index:
#
#   2026-07-10   88 indexed /  86 not indexed / 178 impressions
#   2026-07-11   25 indexed / 151 not indexed /  50 impressions
#   2026-07-24   25 indexed / 151 not indexed /   0 impressions
#
# 72% of indexed pages dropped in one day. 72 URLs now sit in "Discovered –
# currently not indexed", meaning Google saw them in the sitemap and declined
# to spend a crawl on them at all. Publishing more cannot fix that; it is the
# signal that caused it. Recovery requires shrinking the corpus to genuinely
# first-hand work, not adding to it at any cadence.
on:
  workflow_dispatch: {} # manual only — the cron schedule is intentionally gone

# Needed so the workflow can push the generated post back to the repo.
permissions:
  contents: write

concurrency:
  group: ai-blogger
  cancel-in-progress: false

jobs:
  write-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/ai_writer.py

      - name: Commit & push new post
        run: |
          git config user.name "ai-blogger[bot]"
          git config user.email "ai-blogger[bot]@users.noreply.github.com"
          git add src/content/blog scripts/topics.txt public/og
          if git diff --cached --quiet; then
            echo "No new content generated — nothing to commit."
            exit 0
          fi
          git commit -m "content(blog): autonomous post via ChatGPT"
          git push
