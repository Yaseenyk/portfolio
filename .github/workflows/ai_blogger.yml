name: AI Blogger

# Drafts one post a week from a researched brief and opens a pull request.
# It never pushes to main: a person reads the draft, checks every claim
# against the facts listed in the PR, and merges (which deploys).
#
# History, kept because it is the reason for the review gate. The old version
# auto-published ChatGPT posts from topics.txt straight to main, and it cost
# the site its index:
#
#   2026-07-10   88 indexed /  86 not indexed / 178 impressions
#   2026-07-11   25 indexed / 151 not indexed /  50 impressions
#   2026-07-24   25 indexed / 151 not indexed /   0 impressions
#
# The schedule was removed on 2026-08-08. Revived on 2026-10-23 with three
# changes: topics come from keyword research (scripts/post-briefs.json, one
# brief per post, every number sourced), the writer may use only the brief's
# facts and is checked for that, and output goes to a PR, at most one a week.
on:
  schedule:
    - cron: "0 10 * * 1" # Mondays 10:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-blogger
  cancel-in-progress: false

jobs:
  draft-post:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Skip if a draft is already waiting for review
        id: gate
        run: |
          open=$(gh pr list --label ai-draft --state open --json number --jq 'length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
          if [ "$open" != "0" ]; then echo "A draft PR is still open; review it first."; fi

      - name: Set up Python
        if: steps.gate.outputs.open == '0'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.open == '0'
        run: pip install -r scripts/requirements.txt

      - name: Draft the next brief
        if: steps.gate.outputs.open == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/ai_writer.py

      - name: Open the pull request
        if: steps.gate.outputs.open == '0'
        run: |
          if [ ! -f .ai-draft/slug.txt ]; then
            echo "No draft written; nothing to open."
            exit 0
          fi
          slug=$(cat .ai-draft/slug.txt)
          branch="ai-draft/$slug"
          git config user.name "ai-blogger[bot]"
          git config user.email "ai-blogger[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/content/blog public/og scripts/post-briefs.json
          git commit -m "$(cat .ai-draft/title.txt)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push -u origin "$branch"
          gh label create ai-draft --color A855F7 --description "AI-drafted post awaiting review" --force
          gh pr create --base main --head "$branch" --label ai-draft \
            --title "$(cat .ai-draft/title.txt)" --body-file .ai-draft/pr-body.md
