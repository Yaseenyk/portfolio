name: Concierge Worker

# Deploys worker/** changes to Cloudflare (wrangler) on push, or by hand from the Actions tab (or run `npx wrangler deploy`
# in worker/). The daily corpus re-index no longer runs here: it is a Cloudflare cron inside the Worker itself
# (see scheduled() in worker/src/index.ts and [triggers] in worker/wrangler.toml), so it works when GitHub Actions does not.
# Needs the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets; it no-ops gracefully until they are set.
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Deploy worker
        working-directory: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare secrets not configured yet — skipping deploy."
            exit 0
          fi
          npx wrangler@4 deploy
