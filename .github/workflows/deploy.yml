name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Scheduled posts (src/content/blog, `date:` in the future) are written ahead
  # in Claude Code sessions and go live on their own date. Building daily means
  # a delayed or dropped scheduled run is caught up the next day. 00:17 UTC
  # avoids the busy top of the hour, when GitHub delays scheduled runs.
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

# Required for the GitHub Pages deployment to authenticate via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-progress deploy at a time; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: the sitemap takes each page's lastmod from the last
          # commit that touched it, and a shallow clone collapses every file
          # onto one commit date.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # auto-enable Pages (Actions source) — no manual toggle

      - name: Install dependencies
        run: npm ci
        env:
          # puppeteer is local-tooling only (resume PDF) — don't download
          # Chromium on every deploy.
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # On pushes, fail early if any scheduled post would not build on its day.
      # Skipped on the daily run so a release can never be blocked by a lint.
      - name: Check every scheduled post
        if: github.event_name != 'schedule'
        run: npm run check:schedule
        env:
          NEXT_PUBLIC_SITE_URL: https://yk.streamerosai.com

      - name: Build (static export)
        run: npm run build
        env:
          # Custom domain → served at root, so no basePath. Used for
          # canonical/OG/JSON-LD/sitemap URLs.
          NEXT_PUBLIC_SITE_URL: https://yk.streamerosai.com
          # The Concierge Worker (worker/) — switches the terminal from its
          # offline mock to real RAG; the terminal falls back to the mock if
          # the worker is ever unreachable.
          NEXT_PUBLIC_CONCIERGE_URL: https://yaseen-concierge.yaseenyk.workers.dev

      - name: Disable Jekyll
        run: touch ./out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # AEO: tell Bing (whose index feeds ChatGPT search) about new/changed posts
  # the moment they deploy, instead of waiting for a re-crawl. The key is not
  # a secret — it is published at /​<key>.txt by design of the protocol.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE: https://yk.streamerosai.com
      KEY: e8cf5c826c584768e21217b4ecbaaf79
    steps:
      - name: Checkout (with parent commit for the diff)
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Submit changed URLs to IndexNow
        run: |
          urls=("$SITE/" "$SITE/blog/")
          # Posts that went live today by schedule have no diff to find.
          today=$(date -u +%F)
          for f in $(grep -lE "^date: ['\"]?$today" src/content/blog/*.mdx 2>/dev/null); do
            urls+=("$SITE/blog/$(basename "${f%.*}")/")
          done
          for f in $(git diff --name-only HEAD^ HEAD -- src/content 2>/dev/null); do
            [ -f "$f" ] || continue
            slug=$(grep -oP 'slug:\s*"?\K[^",]+' "$f" | head -1)
            [ -z "$slug" ] && slug=$(basename "${f%.*}")
            urls+=("$SITE/blog/$slug/")
          done
          printf 'submitting %s urls:\n' "${#urls[@]}"; printf '  %s\n' "${urls[@]}"
          json=$(printf '"%s",' "${urls[@]}"); json="[${json%,}]"
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"yk.streamerosai.com\",\"key\":\"$KEY\",\"keyLocation\":\"$SITE/$KEY.txt\",\"urlList\":$json}" \
            -w "\nHTTP %{http_code}\n" || true

  # GitHub disables scheduled workflows in public repositories after 60 days
  # without activity. If nothing has been committed for 45 days, a scheduled run
  # records an empty commit so the schedule keeps running. Pushes made with
  # GITHUB_TOKEN do not start another deploy.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Commit if the repository has been quiet for 45 days
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit was $age days ago."
          if [ "$age" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the post schedule active"
            git push
          fi
