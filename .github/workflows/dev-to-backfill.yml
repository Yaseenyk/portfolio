name: Backfill DEV.to from the whole blog

# Half the blog is `.tsx`, which the per-push sync cannot read — it only
# watches `src/content/blog/**.mdx`. This builds the site, converts every
# published post from its built HTML to Markdown, and syncs them.
#
# The weekly cap (2 new per rolling 7 days) drips the backlog out instead of
# dumping articles onto DEV.to in one go.
on:
  # Drains the backlog at most 2 new articles per rolling 7 days (the cap is
  # enforced in scripts/sync-dev-to.ts from DEV.to's own published_at), oldest
  # first. Runs Tuesday and Friday, one new article per run, then no-ops once
  # every post exists on DEV.to.
  schedule:
    - cron: '30 4 * * 2,5'
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new articles this run (the 2-per-7-days cap still applies)"
        required: false
        default: "1"
        type: string
      dry_run:
        description: "List what would be posted without writing to DEV.to"
        required: false
        default: true
        type: boolean

concurrency:
  group: dev-to-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # The sitemap reads each page's lastmod from git history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build the site
        run: npm run build

      - name: Export every post as Markdown
        run: node scripts/export-posts-markdown.mjs

      - name: Sync to DEV.to
        env:
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          MAX_NEW_PER_RUN: ${{ inputs.limit || '1' }}
          WEEKLY_NEW_CAP: '2'
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # The nightly run only fills gaps. Editing a post still updates its
          # DEV.to copy through the push-triggered workflow.
          CREATE_ONLY: 'true'
        run: |
          ADDED_FILES="$(tr '\n' ' ' < .devto/_order.txt)"
          export ADDED_FILES
          echo "Candidates: $(echo "$ADDED_FILES" | wc -w)"
          npx tsx scripts/sync-dev-to.ts
