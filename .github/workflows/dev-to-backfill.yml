name: Backfill DEV.to from the whole blog

# Half the blog is `.tsx`, which the per-push sync cannot read — it only
# watches `src/content/blog/**.mdx`. This builds the site, converts every
# published post from its built HTML to Markdown, and syncs them.
#
# Manual on purpose. MAX_WRITES drips the backlog out over several runs
# instead of dumping fifty articles onto DEV.to in one go.
on:
  # Drains the backlog on its own, three a night, then quietly no-ops once
  # every post exists on DEV.to — including any new one, picked up within a
  # day. Three rather than fifty because a burst reads as a dump to DEV's
  # spam heuristics and to anyone following the feed.
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: "How many articles to create/update this run"
        required: false
        default: "15"
        type: string
      dry_run:
        description: "List what would be posted without writing to DEV.to"
        required: false
        default: true
        type: boolean

concurrency:
  group: dev-to-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The sitemap reads each page's lastmod from git history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Export every post as Markdown
        run: node scripts/export-posts-markdown.mjs

      - name: Sync to DEV.to
        env:
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          MAX_WRITES: ${{ inputs.limit || '15' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # The nightly run only fills gaps. Editing a post still updates its
          # DEV.to copy through the push-triggered workflow.
          CREATE_ONLY: 'true'
        run: |
          ADDED_FILES="$(tr '\n' ' ' < .devto/_order.txt)"
          export ADDED_FILES
          echo "Candidates: $(echo "$ADDED_FILES" | wc -w)"
          npx tsx scripts/sync-dev-to.ts
